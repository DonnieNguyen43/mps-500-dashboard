<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBgFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C2B"/><stop offset="100%" stop-color="#090D14"/>
    </linearGradient>
    <linearGradient id="alphaGradientFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080FF"/><stop offset="50%" stop-color="#00D287"/><stop offset="100%" stop-color="#60FFAF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="70%" stop-color="#E2E8F0"/><stop offset="100%" stop-color="#00D287"/>
    </linearGradient>
    <filter id="neonGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Group (Scaled to 96x96 at x=10, y=12) -->
  <g transform="translate(10, 12) scale(0.48)">
    <polygon points="100,12 178,52 178,148 100,188 22,148 22,52" fill="url(#shieldBgFull)" stroke="#22334D" stroke-width="3"/>
    <line x1="22" y1="100" x2="178" y2="100" stroke="#1B283D" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="100" y1="12" x2="100" y2="188" stroke="#1B283D" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="52" y="108" width="9" height="28" rx="3" fill="#E74C3C" opacity="0.85"/>
    <rect x="68" y="86" width="9" height="50" rx="3" fill="#F39C12" opacity="0.85"/>
    <rect x="84" y="60" width="9" height="76" rx="3" fill="#00D287" opacity="0.9"/>
    <g filter="url(#neonGlowFull)">
      <path d="M72,148 L72,56 C72,52 76,49 80,51 L100,76 L120,51 C124,49 128,52 128,56 L128,102 L116,102 L116,72 L104,87 C102,90 98,90 96,87 L84,72 L84,148 Z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M128,95 L148,68 L148,148 L136,148 L136,110 L124,126 C121,130 115,128 115,123 L115,108 L128,95 Z" fill="url(#alphaGradientFull)"/>
      <circle cx="148" cy="68" r="4.5" fill="#FFFFFF"/>
      <circle cx="148" cy="68" r="9" fill="#00D287" opacity="0.4"/>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="122" y1="24" x2="122" y2="96" stroke="#22334D" stroke-width="1.5"/>

  <!-- Right Typography Group -->
  <text x="140" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="url(#textGrad)" letter-spacing="1.5">
    MPS<tspan fill="#00D287">-500</tspan>
  </text>
  
  <rect x="360" y="32" width="138" height="22" rx="4" fill="rgba(0, 210, 135, 0.12)" stroke="rgba(0, 210, 135, 0.3)" stroke-width="1"/>
  <text x="429" y="47" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#00D287" text-anchor="middle" letter-spacing="1">QUANT TERMINAL</text>

  <text x="142" y="82" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0" letter-spacing="2.2">
    MULTIMODAL MARKET PREDICTION SYSTEM
  </text>

  <text x="142" y="101" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#8C9BA5" letter-spacing="1">
    FinBERT NLP × Hybrid Multi-Tree Ensemble • S&amp;P 500
  </text>
</svg>
